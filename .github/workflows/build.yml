name: Build APK
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
    inputs:
      zip:
        description: 'Tên file zip (để trống = zip mới nhất)'
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Chọn file zip
        id: pick
        run: |
          Z="${{ github.event.inputs.zip }}"
          if [ -z "$Z" ]; then
            Z=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^[^/]+\.zip$' | tail -1 || true)
          fi
          if [ -z "$Z" ]; then Z=$(ls -v *.zip | tail -1); fi
          echo "Dùng file: $Z"
          echo "zip=$Z" >> $GITHUB_OUTPUT
          echo "name=${Z%.zip}" >> $GITHUB_OUTPUT
      - run: unzip -q "${{ steps.pick.outputs.zip }}" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          D=$(dirname "$(find proj -maxdepth 3 -name 'settings.gradle*' | head -1)")
          cd "$D"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . -path '*outputs/apk*' -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/out/" \;
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.name }}-apk
          path: out/*.apk
